# Grafana configuration.
# Values wrapped in ${...} are expanded from container environment variables
# (sourced from .env) — see https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#variable-expansion

[security]
admin_user = ${GF_SECURITY_ADMIN_USER}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
# Disable Embedding: prevents clickjacking unless you explicitly need Grafana
# embedded in another site's iframe.
allow_embedding = false

[users]
allow_sign_up = false

[auth.anonymous]
enabled = true
org_role = Viewer

[panels]
# Allows provisioned text panels to embed VIPSA camera/control iframes.
disable_sanitize_html = true
